function actionHint(sq,rangeTxt,restBlocked,csk,skillType,skillLabel){
  if(STATE.pendingActionType==='move'||STATE.pendingActionType==null) return '光っているマスへ移動できます（行動力に応じて基本'+(sq.race.baseMoveSteps||2)+'マス）。移動した方向が新しい正面になります。何もしなければ他の行動を選んでください。';
  if(STATE.pendingActionType==='attack') return '射程内の敵をクリックして攻撃対象を選択（射程'+rangeTxt+'）。攻撃すると部隊の正面が対象の方向に変わる。正面から攻撃するほど与ダメージ増、背後を突かれた敵は被ダメージ増。';
  if(STATE.pendingActionType==='skill'){
    const cdNote = '使用後は3ターン（アテナの民は2ターン）使用不可。';
    if(csk){
      if(skillType==='attack') return `戦術「${skillLabel}」：${csk.desc} 士気70以上で使用可、${cdNote} 射程内の敵をクリック。`;
      if(skillType==='selfbuff') return `戦術「${skillLabel}」：${csk.desc} 士気70以上で使用可、${cdNote} ボタンを押すだけで即発動（対象選択不要）。`;
      if(skillType==='teambuff') return `戦術「${skillLabel}」：${csk.desc} 士気70以上で使用可、${cdNote} ボタンを押すだけで即発動（対象選択不要）。`;
      if(skillType==='moveattack') return `戦術「${skillLabel}」：${csk.desc} 士気70以上で使用可、${cdNote} 光っているマスから移動先を選んでください。`;
      if(skillType==='allymove') return `戦術「${skillLabel}」：${csk.desc} 士気70以上で使用可、${cdNote} 味方部隊をクリックしてください。`;
    }
    if(skillType==='heal') return `戦術「治癒」：敵ではなく味方部隊をクリックして兵を回復。士気70以上で使用可、${cdNote}`;
    return `戦術（強力な一撃）。士気70以上で使用可、${cdNote} 射程内の敵をクリック。`;
  }
  if(STATE.pendingActionType==='guard') return '自衛：この部隊は今ターン攻撃せず防御に徹する。受けるダメージが半減する。';
  if(STATE.pendingActionType==='rest') return restBlocked? '敵アフロディテの民の部隊が周囲5マス以内にいるため、休憩による回復ができない。':'休憩（6時間睡眠を想定した簡易処理）：士気回復（装備・種族補正あり）、兵数も少し回復。士気はこれでしか回復しない。';
  return '行動の種類を選んでください。';
}
function chooseAction(type){
  const sq=STATE.squads[STATE.selectedSquadId];
  if(type==='rest' && auraBlocksRest(sq)) return;
  if(type==='move' && sq.moveLockedTurns>0) return;
  STATE.pendingActionType=type;
  if(type==='rest'){ sq.plan={type:'rest'}; }
  else if(type==='guard'){ sq.plan={type:'guard'}; }
  else if(type==='skill'){
    const csk=COMMANDER_SKILLS[sq.commander];
    if(csk && (csk.type==='selfbuff'||csk.type==='teambuff')){ sq.plan={type:'skill'}; }
    else { sq.plan=null; }
  }
  else { sq.plan=null; }
  renderAll();
}
function cancelPlan(){
  const sq=STATE.squads[STATE.selectedSquadId];
  sq.plan=null; STATE.pendingActionType=null;
  renderAll();
}
function onHexClick(c,r){
  const sq=STATE.squads[STATE.selectedSquadId];
  if(!sq) return;
  const csk=COMMANDER_SKILLS[sq.commander];
  if(STATE.pendingActionType==='skill' && csk && csk.type==='moveattack'){
    sq.plan={type:'skill', col:c, row:r};
    renderAll();
    return;
  }
  STATE.pendingActionType='move';
  sq.plan={type:'move',col:c,row:r};
  renderAll();
}
function onOwnHexClick(){
  const sq=STATE.squads[STATE.selectedSquadId];
  if(!sq || auraBlocksRest(sq)) return;
  sq.plan={type:'rest'};
  STATE.pendingActionType='rest';
  renderAll();
}
function onAdjacentEnemyClick(targetIdx){
  const sq=STATE.squads[STATE.selectedSquadId];
  if(!sq) return;
  const target=STATE.squads[targetIdx];
  if(!target || !target.alive) return;
  sq.plan={type:'attack',targetIdx};
  STATE.pendingActionType='attack';
  renderAll();
}
function onTargetClick(targetIdx){
  const sq=STATE.squads[STATE.selectedSquadId];
  if(!sq) return;
  if(STATE.pendingActionType==='attack'){ sq.plan={type:'attack',targetIdx}; renderAll(); }
  else if(STATE.pendingActionType==='skill'){ sq.plan={type:'skill',targetIdx}; renderAll(); }
}
function onUnitClick(idx){
  const sq=STATE.squads[idx];
  if(!sq.alive || sq.owner!==viewer() || STATE.over) return;
  if(STATE.selectedSquadId===idx){
    // クリックし直し＝自マスをクリックしたのと同じ扱いで休憩入力
    if(auraBlocksRest(sq)) return;
    sq.plan={type:'rest'};
    STATE.pendingActionType='rest';
    renderAll();
  } else {
    selectSquad(idx);
  }
}
function lockInSelected(){
  STATE.selectedSquadId=null; STATE.pendingActionType=null;
  renderAll();
}
function allMineHavePlans(){
  return STATE.squads.filter(s=>s.owner===viewer()&&s.alive).every(s=>s.plan);
}

/* ======================================================================
   CPU AI
   ====================================================================== */
function decideCPU(owner){
  const mine=STATE.squads.filter(s=>s.owner===owner&&s.alive);
  mine.forEach(sq=>{
    const foes=enemySquads(owner).filter(t=>t.alive);
    const visibleFoes=foes.filter(t=>squadVisibleTo(t,owner));
    const inRange=sq.attackLockedTurns>0 ? [] : visibleFoes.filter(t=>{
      const d=hexDistance(sq.col,sq.row,t.col,t.row);
      return d>=sq.rangeMin && d<=sq.rangeMax;
    });
    // Aphrodite: prioritize healing a badly wounded ally
    if(sq.race.healSkill && canUseSkill(sq)){
      const wounded=STATE.squads.filter(t=>t.alive&&t.owner===owner&&t!==sq&&t.hp/t.maxHp<0.6);
      if(wounded.length && Math.random()<0.7){
        wounded.sort((a,b)=>a.hp-b.hp);
        sq.plan={type:'skill',targetIdx:STATE.squads.indexOf(wounded[0])};
        return;
      }
    }
    // 部隊長固有の自己/全体バフ戦術（対象選択不要）
    const cskCPU=COMMANDER_SKILLS[sq.commander];
    if(cskCPU && canUseSkill(sq)){
      if(cskCPU.type==='selfbuff' && sq.hp/sq.maxHp<0.7 && Math.random()<0.6){ sq.plan={type:'skill'}; return; }
      if(cskCPU.type==='teambuff' && Math.random()<0.45){ sq.plan={type:'skill'}; return; }
    }
    if(sq.morale<20 && Math.random()<0.5){
      if(auraBlocksRest(sq)){ if(sq.canGuard && sq.guardBrokenTurns<=0){ sq.plan={type:'guard'}; return; } }
      else { sq.plan={type:'rest'}; return; }
    }
    if(inRange.length){
      inRange.sort((a,b)=>a.hp-b.hp);
      const target=inRange[0];
      if(sq.canGuard && sq.guardBrokenTurns<=0 && sq.hp/sq.maxHp<0.35 && Math.random()<0.5){ sq.plan={type:'guard'}; return; }
      if(canUseSkill(sq) && !sq.race.healSkill && Math.random()<0.6) sq.plan={type:'skill',targetIdx:STATE.squads.indexOf(target)};
      else sq.plan={type:'attack',targetIdx:STATE.squads.indexOf(target)};
      return;
    }
    if(sq.morale<40 && !auraBlocksRest(sq)){ sq.plan={type:'rest'}; return; }
    // move toward nearest visible foe, else toward map center / enemy start side
    let goal;
    if(visibleFoes.length){
      visibleFoes.sort((a,b)=>hexDistance(sq.col,sq.row,a.col,a.row)-hexDistance(sq.col,sq.row,b.col,b.row));
      goal=visibleFoes[0];
    } else {
      goal={col: owner===1?COLS-1:0, row: sq.row};
    }
    const occ=new Set(STATE.squads.filter(s=>s.alive).map(s=>s.col+'_'+s.row));
    occ.delete(sq.col+'_'+sq.row);
    const reach=reachableHexes(sq.col,sq.row,moveSteps(sq),occ);
    const fallback = ()=> (sq.canGuard && sq.guardBrokenTurns<=0 && auraBlocksRest(sq)) ? {type:'guard'} : {type:'rest'};
    if(reach.length){
      reach.sort((a,b)=>hexDistance(a.col,a.row,goal.col,goal.row)-hexDistance(b.col,b.row,goal.col,goal.row));
      const best=reach[0];
      if(hexDistance(best.col,best.row,goal.col,goal.row) < hexDistance(sq.col,sq.row,goal.col,goal.row)){
        sq.plan={type:'move',col:best.col,row:best.row};
      } else { sq.plan=fallback(); }
    } else { sq.plan=fallback(); }
  });
}

/* ======================================================================
   Turn resolution
   ====================================================================== */
function allSquadsSet(){
  if(!allMineHavePlans()) return;
  if(STATE.mode==='cpu'){
    decideCPU(2);
    resolveTurn();
  } else {
    submitOnlineTurn();
  }
}

function resolveTurn(){
  addLog('turn','── '+STATE.day+'日目 '+String(STATE.hour).padStart(2,'0')+':00 ── '+STATE.weather+'・風向き'+DIR_NAMES[STATE.wind]);
  const alive=()=>STATE.squads.filter(s=>s.alive);
  TURN_HIT_FLAG=false;

  // 1) movement collisions
  const movers=alive().filter(s=>s.plan && s.plan.type==='move');
  const destMap={};
  movers.forEach(s=>{
    const k=s.plan.col+'_'+s.plan.row;
    destMap[k]=destMap[k]||[];
    destMap[k].push(s);
  });
  const stationary=new Set(alive().filter(s=>!(s.plan&&s.plan.type==='move')).map(s=>s.col+'_'+s.row));

  Object.keys(destMap).forEach(k=>{
    const group=destMap[k];
    if(stationary.has(k)){
      group.forEach(s=>{
        const occupant=alive().find(o=>o.col+'_'+o.row===k);
        addLog('move',`${sideLabel(s)}${s.raceName}${s.name}が${occupant.owner!==s.owner?'敵':'味方'}部隊に行く手を阻まれ停止。`);
        pushHistory(s,`${occupant.raceName}${occupant.name}に行く手を阻まれ停止`);
        if(occupant && occupant.owner!==s.owner){ clashDamage(s,occupant); }
      });
      return;
    }
    if(group.length===1){
      const s=group[0];
      const dir=directionBetweenHexes(s.col,s.row,s.plan.col,s.plan.row);
      s.facing=dir;
      s.col=s.plan.col; s.row=s.plan.row;
      addLog('move',`${sideLabel(s)}${s.raceName}${s.name}が${DIR_NAMES[dir]}へ進軍（正面：${DIR_NAMES[dir]}）。`);
      pushHistory(s,`${DIR_NAMES[dir]}へ進軍`);
    } else {
      const withMob=group.map(s=>({s,m:effStats(s).mob}));
      withMob.sort((a,b)=>b.m-a.m);
      const top=withMob[0].m;
      const winners=withMob.filter(w=>w.m===top);
      if(winners.length===1){
        const w=winners[0].s;
        const dir=directionBetweenHexes(w.col,w.row,w.plan.col,w.plan.row);
        w.facing=dir; w.col=w.plan.col; w.row=w.plan.row;
        addLog('move',`鉢合わせ！ ${sideLabel(w)}${w.raceName}${w.name}が行動力で押し勝ちマスを確保。`);
        pushHistory(w,`鉢合わせで押し勝ち${DIR_NAMES[dir]}へ進軍`);
        withMob.slice(1).forEach(l=>{ addLog('move',`${sideLabel(l.s)}${l.s.raceName}${l.s.name}はノックバックし停止。`); pushHistory(l.s,`鉢合わせでノックバック`); });
      } else {
        addLog('move','鉢合わせ！ 行動力が拮抗し正面衝突、双方その場に停止し損害を受けた。');
        for(let i=0;i<winners.length;i++)for(let j=i+1;j<winners.length;j++){ clashDamage(winners[i].s,winners[j].s); }
      }
    }
  });

  // 2) attacks & skills (positions after movement)
  const attackers=alive().filter(s=>s.plan && (s.plan.type==='attack'||s.plan.type==='skill'));
  attackers.forEach(s=>{
    if(s.plan.type==='skill'){
      const csk=COMMANDER_SKILLS[s.commander];
      if(csk && csk.type==='selfbuff'){ applyCommanderSelfBuff(s,csk); return; }
      if(csk && csk.type==='teambuff'){ applyCommanderTeamBuff(s,csk); return; }
      if(csk && csk.type==='moveattack'){ applyKirieSkill(s,csk); return; }
      if(csk && csk.type==='allymove'){
        const target=STATE.squads[s.plan.targetIdx];
        if(target && target.alive && target.owner===s.owner) applyNalaSkill(s,csk,target);
        return;
      }
    }
    const target=STATE.squads[s.plan.targetIdx];
    if(!target) return;
    if(s.plan.type==='skill' && s.race.healSkill){
      if(!target.alive || target.owner!==s.owner) return;
      doHeal(s,target);
      return;
    }
    if(!target.alive) return;
    const d=hexDistance(s.col,s.row,target.col,target.row);
    if(d<s.rangeMin || d>s.rangeMax){ addLog('atk',`${sideLabel(s)}${s.raceName}${s.name}の攻撃は射程外で不発。`); return; }
    doAttack(s,target, s.plan.type==='skill');
  });

  // 3) rest
  alive().filter(s=>s.plan && s.plan.type==='rest').forEach(s=>{
    if(auraBlocksRest(s)){
      addLog('rest',`${sideLabel(s)}${s.raceName}${s.name}は敵アフロディテの民の加護圏内で休憩できず、士気は回復しなかった。`);
      pushHistory(s,'敵の加護で休憩を妨害された');
      return;
    }
    const gain=8*s.restMult;
    s.morale=Math.min(100,s.morale+gain);
    s.hp=Math.min(s.maxHp,s.hp+Math.round(s.maxHp*0.02));
    addLog('rest',`${sideLabel(s)}${s.raceName}${s.name}が休憩し士気+${Math.round(gain)}。`);
    pushHistory(s,`休憩（士気+${Math.round(gain)}）`);
  });
  alive().filter(s=>s.plan && s.plan.type==='guard').forEach(s=>{
    addLog('rest',`${sideLabel(s)}${s.raceName}${s.name}が自衛態勢（被ダメージ半減）。`);
    pushHistory(s,'自衛態勢をとった');
  });

  // 3.5) passive regen/morale (アフロディテの民のHP自然回復、デュオニソスの民の士気自然上昇。行動に関わらず毎ターン)
  alive().forEach(s=>{
    if(s.race.passiveRegen){
      const heal=Math.round(s.maxHp*s.race.passiveRegen);
      if(s.hp<s.maxHp){ s.hp=Math.min(s.maxHp,s.hp+heal); addLog('rest',`${sideLabel(s)}${s.raceName}${s.name}は女神の恩恵で自然回復+${heal}。`); }
    }
    if(s.race.passiveMoraleRegen && s.morale<100){
      s.morale=Math.min(100,s.morale+s.race.passiveMoraleRegen);
      addLog('rest',`${sideLabel(s)}${s.raceName}${s.name}は酒神の恩恵で士気+${s.race.passiveMoraleRegen}。`);
    }
  });

  // 4) desertion for low morale
  alive().forEach(s=>{
    if(s.morale<20){
      const dmg = Math.round(s.maxHp * (s.moraleGuard?0.015:0.03));
      s.hp=Math.max(0,s.hp-dmg);
      applyMoraleLoss(s, s.moraleGuard?1:2);
      addLog('desert',`${sideLabel(s)}${s.raceName}${s.name}は士気崩壊で脱走兵が発生（-${dmg}）。`);
      pushHistory(s,`士気崩壊で脱走兵発生（-${dmg}）`);
      checkDeath(s);
    }
  });

  // 4.5) guard-break countdown
  alive().forEach(s=>{
    if(s.guardBrokenTurns>0) s.guardBrokenTurns--;
    if(s.skillCooldown>0) s.skillCooldown--;
    if(s.moveLockedTurns>0) s.moveLockedTurns--;
    if(s.damageReductionTurns>0) s.damageReductionTurns--;
    if(s.mobBuffTurns>0){ s.mobBuffTurns--; if(s.mobBuffTurns<=0) s.mobBuffMult=1; }
    if(s.flightTurns>0) s.flightTurns--;
    if(s.stealthTurns>0) s.stealthTurns--;
    if(s.ignoreWeaponDemeritTurns>0) s.ignoreWeaponDemeritTurns--;
    if(s.weaponDefBuffTurns>0) s.weaponDefBuffTurns--;
    if(s.attackLockedTurns>0) s.attackLockedTurns--;
    if(s.moraleImmuneTurns>0) s.moraleImmuneTurns--;
    if(s.drunkenTurns>0) s.drunkenTurns--;
    if(s.skillImmuneTurns>0) s.skillImmuneTurns--;
  });

  // reset plans
  STATE.squads.forEach(s=>{ s.plan=null; s.actedThisTurn=false; });

  // 5) advance clock
  STATE.hour=(STATE.hour+1)%24;
  if(STATE.hour===6){
    STATE.day+=1;
    rollWeather();
  }
  STATE.turnNum++;

  // 6) win check
  const p1Taisho=STATE.squads.find(s=>s.owner===1&&s.isTaisho);
  const p2Taisho=STATE.squads.find(s=>s.owner===2&&s.isTaisho);
  if(!p1Taisho.alive || !p2Taisho.alive){
    STATE.over=true;
    const won = STATE.mode==='online' ? (p1Taisho.alive? (STATE.online.myOwner===1) : (STATE.online.myOwner===2))
                                       : p1Taisho.alive;
    showResult(won);
  }
  STATE.selectedSquadId=null; STATE.pendingActionType=null;
  renderAll();
  if(TURN_HIT_FLAG) screenImpact();
}
function rollWeather(){
  STATE.wind=Math.floor(Math.random()*6);
  STATE.weather = Math.random()<0.25 ? '雨' : '晴れ';
}

function sideLabel(s){ return s.owner===1?'【味方1】':'【敵陣】'; }
function clashDamage(a,b){
  const ea=effStats(a), eb=effStats(b);
  const dmgA=Math.round(20+ea.atk*0.15), dmgB=Math.round(20+eb.atk*0.15);
  a.hp=Math.max(0,a.hp-dmgB); b.hp=Math.max(0,b.hp-dmgA);
  applyMoraleLoss(a,3); applyMoraleLoss(b,3);
  pushHistory(a,`${b.raceName}${b.name}と正面衝突（-${dmgB}）`);
  pushHistory(b,`${a.raceName}${a.name}と正面衝突（-${dmgA}）`);
  TURN_HIT_FLAG=true; playHitSfx();
  checkDeath(a); checkDeath(b);
}
function checkDeath(s){ if(s.hp<=0 && s.alive){ s.alive=false; addLog('down',`${sideLabel(s)}${s.raceName}${s.name} 壊滅。`); pushHistory(s,'壊滅した'); } }

/* ---- core damage formula ----
   1.5 × (自部隊HPratio×士気ratio×攻撃値) ÷ (敵部隊HPratio×士気ratio×防御値) × 基準値
   に向き補正・武器固有効果・地形/天候を掛け合わせる。基準値は10000兵を数ターンで削り合える値に調整。 */
const DAMAGE_SCALE=950;
function facingFactors(attacker,target,facingSource){
  const src = facingSource||attacker;
  const dirAtkToTarget = directionBetweenHexes(src.col,src.row,target.col,target.row);
  const dirTargetToAtk = (dirAtkToTarget+3)%6;
  const atkFacingDiff = angleDiff(src.facing, dirAtkToTarget);
  const defFacingDiff = angleDiff(target.facing, dirTargetToAtk);
  const atkFactor = atkFacingDiff===0?1.2 : atkFacingDiff===1?1.05 : atkFacingDiff===2?0.95:0.85;
  let defTakenFactor = defFacingDiff===0?0.75 : defFacingDiff===1?0.9 : defFacingDiff===2?1.15:1.4;
  return {atkFactor,defTakenFactor,defFacingDiff};
}
function computeDamage(attacker,target,atkStatOverride,facingSource,skillMult,extraIgnoreDef){
  const ea=effStats(attacker), ed=effStats(target);
  let atkStat = (atkStatOverride!=null? atkStatOverride : ea.atk) * (skillMult||1);
  let defStat = ed.def;
  if(attacker.ignoreDef) defStat *= (1-attacker.ignoreDef);
  if(extraIgnoreDef) defStat *= (1-extraIgnoreDef);

  // 弓：地形・天候・風向き
  if(attacker.variableTerrain){
    const terrainAtk=terrainAt(attacker.col,attacker.row), terrainDef=terrainAt(target.col,target.row);
    if(terrainAtk==='hill') atkStat*=1.2;
    if(terrainDef==='forest') atkStat*=0.5;
    const dirAtkToTarget=directionBetweenHexes(attacker.col,attacker.row,target.col,target.row);
    const windAlign=angleDiff(dirAtkToTarget,STATE.wind);
    if(windAlign===0) atkStat*=1.15; else if(windAlign===3) atkStat*=0.85;
    if(STATE.weather==='雨') atkStat*=0.85;
  }
  if(terrainAt(target.col,target.row)==='hill') defStat*=1.15;

  const {atkFactor,defTakenFactor,defFacingDiff} = facingFactors(attacker,target,facingSource);
  let finalDefFactor = defTakenFactor;
  if(target.plan && target.plan.type==='guard') finalDefFactor*=0.5; // 盾の自衛
  if(target.damageReductionTurns>0) finalDefFactor*=0.6; // バルドの戦術「鉄壁」

  let dmg = 1.5 * (atkStat/Math.max(8,defStat)) * DAMAGE_SCALE * atkFactor * finalDefFactor;
  dmg *= (0.9+Math.random()*0.2);
  dmg = Math.max(50,Math.round(dmg));
  return {dmg, defFacingDiff};
}

function doAttack(attacker,target,isSkill){
  if(attacker.attackLockedTurns>0){
    addLog('atk',`${sideLabel(attacker)}${attacker.raceName}${attacker.name}は「惑器」で行動不能のため攻撃できなかった。`);
    pushHistory(attacker,'「惑器」の影響で攻撃不能');
    return;
  }
  const csk = isSkill ? COMMANDER_SKILLS[attacker.commander] : null;
  const isCommanderAtkSkill = csk && csk.type==='attack';
  let skillMult=1.0, extraIgnoreDef=0;
  if(isSkill){
    if(isCommanderAtkSkill){
      skillMult = csk.calcMult(attacker,target);
      extraIgnoreDef = csk.extraIgnoreDef||0;
    } else {
      skillMult=1.8;
      if(attacker.race.skillAmp) skillMult = 1+(skillMult-1)*attacker.race.skillAmp;
    }
  }
  if(!isSkill){ attacker.attackCount=(attacker.attackCount||0)+1; }
  const {dmg, defFacingDiff} = computeDamage(attacker,target,null,attacker,skillMult,extraIgnoreDef);

  // シルフィの戦術「飛翔」／バックスの戦術「鉄甲」：条件を満たす攻撃を無効化
  const evadedFlight = target.flightTurns>0 && !isSkill && !attacker.variableTerrain && !attacker.guardCounter;
  const evadedIronArmor = isSkill && target.skillImmuneTurns>0;
  const evaded = evadedFlight || evadedIronArmor;
  const finalDmg = evaded? 0 : dmg;
  target.hp=Math.max(0,target.hp-finalDmg);
  if(!evaded && finalDmg>0){ target.timesHit=(target.timesHit||0)+1; } // ミューラ「堅忍」用のカウント
  TURN_HIT_FLAG=true; playHitSfx();
  attacker.facing = directionBetweenHexes(attacker.col,attacker.row,target.col,target.row); // 攻撃時も正面が対象方向へ変わる

  let atkMoraleCost = isSkill? 10 : 4;
  if(!isSkill && attacker.atkMoraleCost) atkMoraleCost += attacker.atkMoraleCost;
  if(isSkill && attacker.race.skillMoraleCostMult) atkMoraleCost = Math.round(atkMoraleCost*attacker.race.skillMoraleCostMult);
  applyMoraleLoss(attacker, atkMoraleCost);
  if(!evaded) applyMoraleLoss(target, defFacingDiff>=2?10:6);

  if(isCommanderAtkSkill && csk.selfCostRatio){
    const cost=Math.round(attacker.maxHp*csk.selfCostRatio);
    attacker.hp=Math.max(1,attacker.hp-cost);
    addLog('atk',`${sideLabel(attacker)}${attacker.raceName}${attacker.name}は「${csk.name}」の代償で自ら${cost}のダメージを負った。`);
    pushHistory(attacker,`戦術「${csk.name}」の代償で自傷（-${cost}）`);
  }
  if(isCommanderAtkSkill && csk.selfEffect) csk.selfEffect(attacker);
  if(isSkill){ attacker.skillCooldown = attacker.race.skillCooldown||3; }
  if(!evaded && attacker.guardBreak && target.canGuard){ target.guardBrokenTurns=2; }

  const facingNote = defFacingDiff===0?'正面から':defFacingDiff===3?'背後から！':defFacingDiff===1?'斜め前から':'側面から';
  const guardNote = (target.plan&&target.plan.type==='guard')?'（自衛中で被害半減）':'';
  const skillNameNote = isCommanderAtkSkill? `戦術「${csk.name}」で` : (isSkill?'戦術で':'');
  if(evaded){
    const reason = evadedIronArmor? '「鉄甲」で無効化した' : '「飛翔」で回避した';
    addLog('atk',`${sideLabel(attacker)}${attacker.raceName}${attacker.name}(${attacker.weaponLabel})が${facingNote}攻撃！ しかし${sideLabel(target)}${target.raceName}${target.name}は${reason}。`);
    pushHistory(attacker,`${target.raceName}${target.name}への攻撃は${reason}`);
    pushHistory(target,`${attacker.raceName}${attacker.name}の攻撃を${reason}`);
  } else {
    addLog('atk',`${sideLabel(attacker)}${attacker.raceName}${attacker.name}(${attacker.weaponLabel})が${skillNameNote}${facingNote}攻撃！ ${sideLabel(target)}${target.raceName}${target.name}に${finalDmg}ダメージ${guardNote}。`);
    if(isCommanderAtkSkill && csk.extraIgnoreDef) addLog('atk',`（${csk.name}の効果で敵防御の${Math.round(csk.extraIgnoreDef*100)}%を無視した）`);
    if(attacker.guardBreak && target.canGuard) addLog('atk',`${sideLabel(target)}${target.raceName}${target.name}はガードを崩され2ターン自衛不可に！`);
    pushHistory(attacker,`${target.raceName}${target.name}を${facingNote}攻撃（${finalDmg}ダメージ）`);
    pushHistory(target,`${attacker.raceName}${attacker.name}から${facingNote.replace('から','')}攻撃を受けた（${finalDmg}ダメージ${guardNote}）`);
  }
  checkDeath(target);
  if(!evaded && target.drunkenTurns>0 && attacker.alive){
    attacker.moveLockedTurns=Math.max(attacker.moveLockedTurns||0,3);
    addLog('atk',`${sideLabel(target)}${target.raceName}${target.name}の「泥酔」で${sideLabel(attacker)}${attacker.raceName}${attacker.name}は2ターン足止めされた。`);
    pushHistory(attacker,`${target.raceName}${target.name}の「泥酔」で足止めされた`);
  }
  if(isCommanderAtkSkill && csk.selfEffect){ addLog('atk',`${sideLabel(attacker)}${attacker.raceName}${attacker.name}は「${csk.name}」の反動で次ターン動けない。`); }
  if(!evaded && isCommanderAtkSkill && csk.doubleHit && target.alive){
    const second = computeDamage(attacker,target,null,attacker,skillMult,extraIgnoreDef);
    target.hp=Math.max(0,target.hp-second.dmg);
    TURN_HIT_FLAG=true; playHitSfx();
    addLog('atk',`${sideLabel(attacker)}${attacker.raceName}${attacker.name}の「${csk.name}」二段目！ ${sideLabel(target)}${target.raceName}${target.name}にさらに${second.dmg}ダメージ。`);
    pushHistory(attacker,`「${csk.name}」二段目で${target.raceName}${target.name}にさらに${second.dmg}ダメージ`);
    checkDeath(target);
  }
  if(!evaded && isCommanderAtkSkill && csk.targetEffect && target.alive){
    csk.targetEffect(target);
    const msg = csk.targetEffectMsg || '効果を受けた';
    addLog('atk',`${sideLabel(target)}${target.raceName}${target.name}は「${csk.name}」で${msg}`);
    pushHistory(target,`「${csk.name}」で${msg}`);
  }

  // 槍の護衛反撃：盾が殴られた瞬間、隣接する味方の槍が代わりに反撃（自身は無傷）
  if(!evaded && target.canGuard){
    const guards=STATE.squads.filter(g=>g.alive && g.owner===target.owner && g!==target && g.guardCounter &&
      hexDistance(g.col,g.row,target.col,target.row)===1);
    guards.forEach(spear=>{
      const {dmg:cdmg} = computeDamage(spear,attacker,null,target,1);
      attacker.hp=Math.max(0,attacker.hp-cdmg);
      TURN_HIT_FLAG=true; playHitSfx();
      addLog('atk',`${sideLabel(spear)}${spear.raceName}${spear.name}が隣接する盾部隊を庇って反撃！（自身は無傷） ${sideLabel(attacker)}${attacker.raceName}${attacker.name}に${cdmg}ダメージ。`);
      pushHistory(spear,`${target.raceName}${target.name}を庇い${attacker.raceName}${attacker.name}へ反撃（${cdmg}ダメージ・自身は無傷）`);
      pushHistory(attacker,`${spear.raceName}${spear.name}の護衛反撃を受けた（${cdmg}ダメージ）`);
      checkDeath(attacker);
    });
  }
}

function applyCommanderSelfBuff(caster,csk){
  csk.apply(caster);
  caster.skillCooldown = caster.race.skillCooldown||3;
  addLog('atk',`${sideLabel(caster)}${caster.raceName}${caster.name}の戦術「${csk.name}」発動！ ${csk.desc}`);
  pushHistory(caster,`戦術「${csk.name}」を発動`);
}
function applyCommanderTeamBuff(caster,csk){
  if(csk.extraCondition && !csk.extraCondition(caster)){
    addLog('atk',`${sideLabel(caster)}${caster.raceName}${caster.name}は「${csk.name}」の発動条件を満たせず不発。`);
    caster.skillCooldown = caster.race.skillCooldown||3;
    return;
  }
  csk.apply(caster);
  caster.skillCooldown = caster.race.skillCooldown||3;
  addLog('atk',`${sideLabel(caster)}${caster.raceName}${caster.name}の戦術「${csk.name}」発動！ ${csk.desc}`);
  pushHistory(caster,`戦術「${csk.name}」を発動（味方全体）`);
}
function applyRudraReposition(caster){
  const foes=STATE.squads.filter(t=>t.alive && t.owner!==caster.owner && squadVisibleTo(t,caster.owner));
  if(!foes.length){ addLog('move',`${sideLabel(caster)}${caster.raceName}${caster.name}の「春嵐」は近くに敵がおらず不発。`); return; }
  foes.sort((a,b)=>hexDistance(caster.col,caster.row,a.col,a.row)-hexDistance(caster.col,caster.row,b.col,b.row));
  const occ=new Set(STATE.squads.filter(s=>s.alive).map(s=>s.col+'_'+s.row));
  occ.delete(caster.col+'_'+caster.row);
  for(const target of foes){
    const rearDir=(target.facing+3)%6;
    const candidates=[rearDir, (rearDir+1)%6, (rearDir+5)%6]; // 背後優先、だめなら隣接する斜め後ろ
    for(const dir of candidates){
      const [nc,nr]=neighbor(target.col,target.row,dir);
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const key=nc+'_'+nr;
      if(occ.has(key)) continue;
      caster.col=nc; caster.row=nr;
      caster.facing=directionBetweenHexes(nc,nr,target.col,target.row);
      addLog('move',`${sideLabel(caster)}${caster.raceName}${caster.name}が「春嵐」で${target.raceName}${target.name}の背後へ回り込んだ！`);
      pushHistory(caster,`「春嵐」で${target.raceName}${target.name}の背後へ移動`);
      return;
    }
  }
  addLog('move',`${sideLabel(caster)}${caster.raceName}${caster.name}の「春嵐」は近くに空きマスがなく不発。`);
}
function applyKirieSkill(caster,csk){
  const dest=caster.plan;
  if(!dest || dest.col==null || dest.row==null){ return; }
  const occ=new Set(STATE.squads.filter(sq=>sq.alive).map(sq=>sq.col+'_'+sq.row));
  occ.delete(caster.col+'_'+caster.row);
  const reach=reachableHexes(caster.col,caster.row,moveSteps(caster),occ);
  if(!reach.some(h=>h.col===dest.col&&h.row===dest.row)){
    addLog('atk',`${sideLabel(caster)}${caster.raceName}${caster.name}の「${csk.name}」は移動先が無効で不発。`);
    return;
  }
  const dir=directionBetweenHexes(caster.col,caster.row,dest.col,dest.row);
  caster.facing=dir; caster.col=dest.col; caster.row=dest.row;
  addLog('move',`${sideLabel(caster)}${caster.raceName}${caster.name}が「${csk.name}」で${DIR_NAMES[dir]}へ疾駆！`);
  pushHistory(caster,`戦術「${csk.name}」で${DIR_NAMES[dir]}へ移動`);
  const foes=enemySquads(caster.owner).filter(t=>t.alive && squadVisibleTo(t,caster.owner) && hexDistance(caster.col,caster.row,t.col,t.row)<=2);
  foes.sort((a,b)=>hexDistance(caster.col,caster.row,a.col,a.row)-hexDistance(caster.col,caster.row,b.col,b.row));
  const picked=foes.slice(0,2);
  if(!picked.length){
    addLog('atk',`${sideLabel(caster)}${caster.raceName}${caster.name}の周囲に敵部隊がおらず「${csk.name}」の追撃は不発。`);
  }
  picked.forEach(t=>{
    const {dmg,defFacingDiff}=computeDamage(caster,t,null,caster,1.6);
    t.hp=Math.max(0,t.hp-dmg);
    TURN_HIT_FLAG=true; playHitSfx();
    applyMoraleLoss(t, defFacingDiff>=2?10:6);
    addLog('atk',`${sideLabel(caster)}${caster.raceName}${caster.name}の「${csk.name}」が${sideLabel(t)}${t.raceName}${t.name}に${dmg}ダメージ！`);
    pushHistory(caster,`「${csk.name}」で${t.raceName}${t.name}を攻撃（${dmg}ダメージ）`);
    pushHistory(t,`${caster.raceName}${caster.name}の「${csk.name}」で${dmg}ダメージを受けた`);
    checkDeath(t);
  });
  if(picked.length) caster.facing=directionBetweenHexes(caster.col,caster.row,picked[0].col,picked[0].row);
  applyMoraleLoss(caster,8);
  caster.skillCooldown = caster.race.skillCooldown||3;
}
function applyNalaSkill(caster,csk,target){
  const occ=new Set(STATE.squads.filter(sq=>sq.alive).map(sq=>sq.col+'_'+sq.row));
  occ.delete(caster.col+'_'+caster.row);
  const candidates=neighborsOf(target.col,target.row).filter(n=>!occ.has(n.col+'_'+n.row));
  caster.skillCooldown = caster.race.skillCooldown||3;
  if(!candidates.length){
    addLog('move',`${sideLabel(caster)}${caster.raceName}${caster.name}の「${csk.name}」は${target.raceName}${target.name}の周囲に空きがなく不発。`);
    return;
  }
  const pick=candidates[Math.floor(Math.random()*candidates.length)];
  const dir=directionBetweenHexes(caster.col,caster.row,pick.col,pick.row);
  caster.col=pick.col; caster.row=pick.row; caster.facing=dir;
  addLog('move',`${sideLabel(caster)}${caster.raceName}${caster.name}が「${csk.name}」で${target.raceName}${target.name}の側へ移動した。`);
  pushHistory(caster,`「${csk.name}」で${target.raceName}${target.name}の周囲へ移動`);
  applyMoraleLoss(caster,4);
}
function doHeal(healer,target){
  const e=effStats(healer);
  let amp = healer.race.skillAmp||1;
  let healAmt = Math.round(e.atk * 9 * amp * (0.85+Math.random()*0.3));
  target.hp=Math.min(target.maxHp,target.hp+healAmt);
  let cost=10;
  if(healer.race.skillMoraleCostMult) cost=Math.round(cost*healer.race.skillMoraleCostMult);
  applyMoraleLoss(healer,cost);
  healer.skillCooldown = healer.race.skillCooldown||3;
  addLog('atk',`${sideLabel(healer)}${healer.raceName}${healer.name}の戦術「治癒」！ ${sideLabel(target)}${target.raceName}${target.name}の兵が${healAmt}回復。`);
  pushHistory(healer,`${target.raceName}${target.name}を治癒（+${healAmt}）`);
  pushHistory(target,`${healer.raceName}${healer.name}に治癒された（+${healAmt}）`);
}

function showResult(won){
  const ov=document.getElementById('result-overlay');
  ov.className='result-overlay active '+(won?'win':'lose');
  document.getElementById('result-title').textContent = won?'勝利':'敗北';
  document.getElementById('result-desc').textContent = won? '敵大将部隊を撃破した。':'大将部隊が壊滅した。';
  stopBGM();
  playFanfare(won);
}

/* ======================================================================
   Online (shared persistent storage, polling)
   ====================================================================== */
let onlinePollTimer=null;
async function submitOnlineSetup(){
  const key=SETUP.roomCode;
  try{
    let room = await safeGet(key,true);
    if(!room){
      room = { status:'waiting', p1:{raceId:SETUP.race,cfgs:SETUP.squads}, p2:null, state:null, turnActions:{} };
      await window.storage.set(key, JSON.stringify(room), true);
      SETUP.isHost=true;
    } else {
      if(room.status==='waiting' && !room.p2){
        room.p2={raceId:SETUP.race,cfgs:SETUP.squads};
        room.status='ready';
        await window.storage.set(key, JSON.stringify(room), true);
        SETUP.isHost=false;
      } else {
        SETUP.isHost = room.status==='waiting';
      }
    }
  }catch(e){ console.error(e); }
  document.getElementById('phase-label') && null;
  showScreen('screen-battle');
  document.getElementById('net-status').textContent='相手の入室を待っています…';
  pollOnlineSetup();
}
async function pollOnlineSetup(){
  const key=SETUP.roomCode;
  onlinePollTimer=setInterval(async ()=>{
    if(STATE) { clearInterval(onlinePollTimer); return; }
    const room=await safeGet(key,true);
    if(room && room.p1 && room.p2 && !STATE){
      clearInterval(onlinePollTimer);
      if(SETUP.isHost && !room.state){
        initBattle({p1:{raceId:room.p1.raceId,cfgs:room.p1.cfgs,isCPU:false}, p2:{raceId:room.p2.raceId,cfgs:room.p2.cfgs,isCPU:false}, mode:'online'});
        await pushOnlineState();
      } else if(room.state){
        loadOnlineState(room.state);
      }
    }
  },2500);
}
async function safeGet(key,shared){
  try{ const r=await window.storage.get(key,shared); return r? JSON.parse(r.value): null; }catch(e){ return null; }
}
function serializeState(){
  return {
    hour:STATE.hour, day:STATE.day, turnNum:STATE.turnNum, map:STATE.map,
    wind:STATE.wind, weather:STATE.weather, teamAtkBonus:STATE.teamAtkBonus,
    squads:STATE.squads.map(s=>({...s,plan:null})), log:STATE.log, over:STATE.over,
  };
}
function loadOnlineState(s){
  const wasNull = !STATE;
  STATE = STATE || {};
  Object.assign(STATE,{
    mode:'online', hour:s.hour, day:s.day, turnNum:s.turnNum, map:s.map,
    wind: s.wind!=null?s.wind:0, weather: s.weather||'晴れ', teamAtkBonus: s.teamAtkBonus||{1:0,2:0},
    squads:s.squads, log:[], over:s.over,
    p1isCPU:false,p2isCPU:false,
    selectedSquadId:null, pendingActionType:null,
    online:{room:SETUP.roomCode, isHost:SETUP.isHost, myOwner: SETUP.isHost?1:2},
  });
  document.getElementById('log-scroll').innerHTML='';
  s.log.forEach(l=>addLog(l.kind,l.msg));
  showScreen('screen-battle');
  renderAll();
  if(!onlineTurnPoll) startOnlinePolling();
}
let onlineTurnPoll=null;
function startOnlinePolling(){
  if(onlineTurnPoll) return;
  onlineTurnPoll=setInterval(async ()=>{
    if(!STATE || STATE.mode!=='online') return;
    const room=await safeGet(STATE.online.room,true);
    if(!room) return;
    const myOwner=STATE.online.myOwner, oppOwner=enemyOwnerOf(myOwner);
    const actions=room.turnActions||{};
    if(actions['p'+oppOwner] && actions['p'+oppOwner].turnNum===STATE.turnNum){
      // opponent submitted; if I already submitted too, host resolves
      if(actions['p'+myOwner] && actions['p'+myOwner].turnNum===STATE.turnNum){
        if(STATE.online.isHost){
          applyPlans(actions['p1'].plans,1); applyPlans(actions['p2'].plans,2);
          resolveTurn();
          room.turnActions={};
          room.state=serializeState();
          await window.storage.set(STATE.online.room, JSON.stringify(room), true);
        }
      }
    }
    if(room.state && room.state.turnNum!==STATE.turnNum){
      loadOnlineState(room.state);
    }
  },2500);
}
function stopOnlinePolling(){
  if(onlinePollTimer){ clearInterval(onlinePollTimer); onlinePollTimer=null; }
  if(onlineTurnPoll){ clearInterval(onlineTurnPoll); onlineTurnPoll=null; }
}
function applyPlans(plans,owner){
  STATE.squads.filter(s=>s.owner===owner).forEach((s,i)=>{ s.plan=plans[i]; });
}
async function pushOnlineState(){
  const room=await safeGet(STATE.online.room,true) || {};
  room.state=serializeState();
  room.turnActions=room.turnActions||{};
  await window.storage.set(STATE.online.room, JSON.stringify(room), true);
}
async function submitOnlineTurn(){
  document.getElementById('net-status').textContent='行動を送信、相手を待っています…';
  const myOwner=STATE.online.myOwner;
  const plans=STATE.squads.filter(s=>s.owner===myOwner).map(s=>s.plan);
  try{
    const room=await safeGet(STATE.online.room,true) || {turnActions:{}};
    room.turnActions=room.turnActions||{};
    room.turnActions['p'+myOwner]={turnNum:STATE.turnNum,plans};
    await window.storage.set(STATE.online.room, JSON.stringify(room), true);
  }catch(e){ console.error(e); }
}
